  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));

    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.

      }

      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.

      // anchors, which closest()/IDL .target get wrong.

            'if (h.charAt(0) !== "#") {' +

              'e.preventDefault();' +

              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');

      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';

      // would push the parser into quirks mode. DOMParser always emits a <head>

      // attributes through, so match the full opening tag.

        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).

      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.

          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div class=\"shelf-scroll\" style=\"min-height:100vh;background:radial-gradient(1200px 620px at 72% -12%, rgba(224,164,73,.08), transparent 58%), #08080c;color:#f3f4f8;font-family:'Hanken Grotesk',system-ui,sans-serif;overflow-x:hidden;\">\n\n  <!-- ============ HEADER ============ -->\n  <header style=\"position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:13px 18px;background:rgba(8,8,12,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.06);\">\n    <div style=\"display:flex;align-items:center;gap:9px;flex:none;\">\n      <div style=\"width:30px;height:30px;border-radius:9px;background:linear-gradient(150deg,#e9b65f,#cf8f33);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(224,164,73,.42);\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#20160a\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM19 3v18\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <span style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.02em;\">Shelf<\u002Fspan>\n    <\u002Fdiv>\n    <label style=\"flex:1;display:flex;align-items:center;gap:9px;min-width:0;max-width:520px;margin:0 auto;background:#13131b;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:9px 13px;\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6b6e80\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.4-3.4\"><\u002Fpath><\u002Fsvg>\n      <input value=\"{{ query }}\" onchange=\"{{ onQuery }}\" placeholder=\"Search title, author, notes\" style=\"flex:1;min-width:0;background:transparent;border:none;outline:none;color:#f3f4f8;font-family:inherit;font-size:14px;\">\n    <\u002Flabel>\n    <button onclick=\"{{ openAdd }}\" style=\"flex:none;display:flex;align-items:center;gap:6px;background:#e0a449;color:#20160a;border:none;border-radius:11px;padding:9px 14px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 14px rgba(224,164,73,.36);\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#20160a\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>\n      <span>Add book<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n\n  <!-- ============ LIBRARY SCREEN ============ -->\n  <sc-if value=\"{{ onLibrary }}\">\n  <main style=\"max-width:1220px;margin:0 auto;padding:0 0 120px;\">\n\n    <!-- CONTROLS SUBBAR -->\n    <sc-if value=\"{{ showControls }}\">\n    <div style=\"position:sticky;top:57px;z-index:30;display:flex;align-items:center;gap:10px;padding:11px 18px;background:rgba(8,8,12,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.05);\">\n      <div class=\"shelf-rail\" style=\"display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;flex:1;min-width:0;\">\n        <sc-for list=\"{{ formatChips }}\" as=\"ch\" hint-placeholder-count=\"4\">\n          <button onclick=\"{{ ch.onClick }}\" style=\"flex:none;padding:7px 13px;border-radius:9px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;border:1px solid {{ ch.border }};background:{{ ch.bg }};color:{{ ch.fg }};\">{{ ch.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"position:relative;flex:none;\">\n        <button onclick=\"{{ toggleSort }}\" style=\"display:flex;align-items:center;gap:7px;background:#13131b;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:7px 11px;color:#f3f4f8;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9a9db0\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M3 6h18M6 12h12M10 18h4\"><\u002Fpath><\u002Fsvg>\n          <span>{{ sortLabel }}<\u002Fspan>\n          <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#6b6e80\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n        <sc-if value=\"{{ sortOpen }}\">\n          <div onclick=\"{{ closeSort }}\" style=\"position:fixed;inset:0;z-index:1;\"><\u002Fdiv>\n          <div style=\"position:absolute;top:42px;right:0;z-index:2;min-width:190px;background:#15151f;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.55);animation:shelfFade .14s ease;\">\n            <sc-for list=\"{{ sortOptions }}\" as=\"o\" hint-placeholder-count=\"5\">\n              <button onclick=\"{{ o.onClick }}\" style=\"display:flex;align-items:center;justify-content:space-between;width:100%;background:{{ o.bg }};border:none;border-radius:8px;padding:9px 11px;color:{{ o.fg }};font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left;\">\n                <span>{{ o.label }}<\u002Fspan>\n                <sc-if value=\"{{ o.active }}\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#e0a449\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m20 6-11 11-5-5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"padding:20px 18px 0;\">\n\n      <!-- LOADING -->\n      <sc-if value=\"{{ isLoading }}\">\n        <div class=\"shelf-skel\" style=\"width:170px;height:20px;border-radius:7px;margin:6px 0 16px;\"><\u002Fdiv>\n        <div style=\"display:flex;gap:14px;overflow:hidden;margin-bottom:34px;\">\n          <sc-for list=\"{{ skeletons }}\" as=\"s\" hint-placeholder-coun  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ============ DETAIL SCREEN ============ -->\n  <sc-if value=\"{{ onDetail }}\">\n  <main style=\"max-width:780px;margin:0 auto;padding:16px 18px 120px;\">\n    <button onclick=\"{{ backToLibrary }}\" style=\"display:flex;align-items:center;gap:7px;background:transparent;border:none;color:#9a9db0;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:14px;\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"><\u002Fpath><\u002Fsvg>Back to shelf\n    <\u002Fbutton>\n\n    <sc-if value=\"{{ detail }}\">\n      <!-- HERO -->\n      <section style=\"display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;\">\n        <div style=\"flex:none;width:150px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:{{ detail.cover }};position:relative;padding:16px 14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(0,0,0,.45);\">\n          <div style=\"position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.09),transparent 38%,rgba(8,8,12,.55));\"><\u002Fdiv>\n          <div style=\"position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(to right,rgba(0,0,0,.34),transparent);\"><\u002Fdiv>\n          <div style=\"position:relative;font-family:'Fraunces',serif;font-weight:600;font-size:21px;line-height:1.1;color:#fdfaf3;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(0,0,0,.45);\">{{ detail.title }}<\u002Fdiv>\n          <div style=\"position:relative;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.74);\">{{ detail.author }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;min-width:230px;display:flex;flex-direction:column;\">\n          <!-- VIEW MODE -->\n          <sc-if value=\"{{ detail.viewMode }}\">\n            <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:9px;\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:{{ detail.statusColor }};padding:4px 9px;border-radius:7px;background:{{ detail.statusBg }};border:1px solid {{ detail.statusBorder }};\"><span style=\"width:7px;height:7px;border-radius:50%;background:{{ detail.statusColor }};\"><\u002Fspan>{{ detail.statusLabel }}<\u002Fspan>\n              <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#9a9db0;padding:4px 9px;border-radius:7px;background:#1a1a25;border:1px solid rgba(255,255,255,.07);\">{{ detail.format }}<\u002Fspan>\n            <\u002Fdiv>\n            <h1 style=\"margin:0 0 5px;font-family:'Fraunces',serif;font-weight:600;font-size:27px;line-height:1.1;letter-spacing:-.01em;\">{{ detail.title }}<\u002Fh1>\n            <div style=\"color:#9a9db0;font-size:15px;margin-bottom:11px;\">{{ detail.author }}<\u002Fdiv>\n            <div style=\"font-size:17px;letter-spacing:1px;color:#e0a449;margin-bottom:13px;\">{{ detail.stars }}<\u002Fdiv>\n            <sc-if value=\"{{ detail.hasPages }}\">\n              <div style=\"margin-bottom:13px;\">\n                <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9a9db0;\">{{ detail.pageLabel }} pages<\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;color:#e0a449;\">{{ detail.pct }}%<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:7px;border-radius:7px;background:#1d1d28;overflow:hidden;\">\n                  <div style=\"height:100%;width:{{ detail.pctW }};border-radius:7px;background:linear-gradient(90deg,#cf8f33,#e9b65f);\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;\">\n              <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#6b6e80;margin-bottom:3px;\">Started<\u002Fdiv><div style=\"font-size:13.5px;color:#dfe2ee;\">{{ detail.startedLabel }}<\u002Fdiv><\u002Fdiv>\n              <div><div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#6b6e80;margin-bottom:3px;\">Finished<\u002Fdiv><div style=\"font-size:13.5px;color:#dfe2ee;\">{{ detail.finishedLabel }}<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;margin-top:auto;\">\n              <button onclick=\"{{ detail.onEdit }}\" style=\"display:flex;align-items:center;gap:7px;background:#1a1a25;border:1px solid rgba(255,255,255,.1);color:#f3f4f8;border-radius:10px;padding:10px 16px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"><\u002Fpath><\u002Fsvg>Edit<\u002Fbutton>\n              <button onclick=\"{{ detail.onMenu }}\" style=\"display:flex;align-items:center;gap:7px;background:#1a1a25;border:1px solid rgba(255,255,255,.1);color:#dfe2ee;border-radius:10px;padding:10px 16px;font-family:inherit;font-weight:600;font-size:13.5px;cursor:pointer;\">Quick log<\u002Fbutton>\n              <button onclick=\"{{ detail.onDelete }}\" aria-label=\"Delete\" style=\"flex:none;width:42px;display:flex;align-items:center;justify-content:center;background:rgba(240,106,106,.1);border:1px solid rgba(240,106,106,.25);color:#f06a6a;border-radius:10px;cursor:pointer;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- EDIT MODE -->\n          <sc-if value=\"{{ detail.editMode }}\">\n            <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#e0a449;margin-bottom:10px;\">Editing<\u002Fdiv>\n            <input value=\"{{ edit.title }}\" onchange=\"{{ eTitle }}\" placeholder=\"Title\" style=\"width:100%;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:11px 12px;color:#f3f4f8;font-family:'Fraunces',serif;font-weight:600;font-size:19px;outline:none;margin-bottom:9px;\">\n            <input value=\"{{ edit.author }}\" onchange=\"{{ eAuthor }}\" placeholder=\"Author\" style=\"width:100%;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:9px 12px;color:#f3f4f8;font-family:inherit;font-size:14px;outline:none;margin-bottom:11px;\">\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;\">\n              <sc-for list=\"{{ editStatuses }}\" as=\"s\" hint-placeholder-count=\"5\"><button onclick=\"{{ s.onClick }}\" style=\"display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid {{ s.border }};background:{{ s.bg }};color:{{ s.fg }};\"><span style=\"width:6px;height:6px;border-radius:50%;background:{{ s.dot }};\"><\u002Fspan>{{ s.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px;\">\n              <sc-for list=\"{{ editFormats }}\" as=\"f\" hint-placeholder-count=\"3\"><button onclick=\"{{ f.onClick }}\" style=\"padding:7px 11px;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid {{ f.border }};background:{{ f.bg }};color:{{ f.fg }};\">{{ f.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:6px;margin-bottom:11px;\">\n              <sc-for list=\"{{ editStars }}\" as=\"b\" hint-placeholder-count=\"5\"><button onclick=\"{{ b.onClick }}\" aria-label=\"Rate\" style=\"width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:9px;cursor:pointer;\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"{{ b.fill }}\" stroke=\"{{ b.stroke }}\" stroke-width=\"1.6\"><path d=\"M12 2.5l2.9 6.1 6.6.9-4.8 4.6 1.2 6.6L12 18.6 6.1 21.3l1.2-6.6L2.5 9.5l6.6-.9z\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px;\">\n              <div><label style=\"display:block;font-size:11px;color:#9a9db0;margin-bottom:4px;\">Current page<\u002Flabel><input type=\"number\" value=\"{{ edit.currentPage }}\" onchange=\"{{ eCurrent }}\" style=\"width:100%;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 11px;color:#f3f4f8;font-family:inherit;font-size:14px;outline:none;\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:11px;color:#9a9db0;margin-bottom:4px;\">Total pages<\u002Flabel><input type=\"number\" value=\"{{ edit.totalPages }}\" onchange=\"{{ eTotal }}\" style=\"width:100%;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 11px;color:#f3f4f8;font-family:inherit;font-size:14px;outline:none;\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:11px;color:#9a9db0;margin-bottom:4px;\">Started<\u002Flabel><input type=\"date\" value=\"{{ edit.started }}\" onchange=\"{{ eStarted }}\" style=\"width:100%;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 11px;color:#f3f4f8;font-family:inherit;font-size:13px;outline:none;color-scheme:dark;\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:11px;color:#9a9db0;margin-bottom:4px;\">Finished<\u002Flabel><input type=\"date\" value=\"{{ edit.finished }}\" onchange=\"{{ eFinished }}\" style=\"width:100%;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 11px;color:#f3f4f8;font-family:inherit;font-size:13px;outline:none;color-scheme:dark;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:9px;\">\n              <button onclick=\"{{ saveEdit }}\" style=\"flex:1;background:#e0a449;color:#20160a;border:none;border-radius:10px;padding:11px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;\">Save changes<\u002Fbutton>\n              <button onclick=\"{{ cancelEdit }}\" style=\"flex:none;padding:11px 18px;background:#1a1a25;border:1px solid rgba(255,255,255,.1);color:#dfe2ee;border-radius:10px;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;\">Cancel<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- NOTES -->\n      <sc-if value=\"{{ detail.viewMode }}\">\n        <section style=\"background:#101019;border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:15px 16px;margin-bottom:14px;\">\n          <div style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b6e80;margin-bottom:8px;\">Notes<\u002Fdiv>\n          <sc-if value=\"{{ detail.hasNotes }}\"><p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#dfe2ee;white-space:pre-wrap;\">{{ detail.notes }}<\u002Fp><\u002Fsc-if>\n          <sc-if value=\"{{ detail.noNotes }}\"><button onclick=\"{{ detail.onEdit }}\" style=\"background:transparent;border:none;color:#6b6e80;font-family:inherit;font-size:13.5px;cursor:pointer;padding:0;\">No notes yet — add a thought…<\u002Fbutton><\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ detail.editMode }}\">\n        <section style=\"margin-bottom:14px;\">\n          <label style=\"display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6b6e80;margin-bottom:8px;\">Notes<\u002Flabel>\n          <textarea value=\"{{ edit.notes }}\" onchange=\"{{ eNotes }}\" placeholder=\"Your thoughts on this book…\" style=\"width:100%;min-height:80px;resize:vertical;background:#16161f;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 13px;color:#f3f4f8;font-family:inherit;font-size:14.5px;outline:none;line-height:1.6;\"><\u002Ftextarea>\n        <\u002Fsection>\n      <\u002Fsc-if>\n\n      <!-- READING LOG -->\n      <section style=\"background:#101019;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:17px 16px;margin-bottom:14px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n          <h2 style=\"margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;\">Reading log<\u002Fh2>\n          <button onclick=\"{{ toggleSessionForm }}\" style=\"display:flex;align-items:center;gap:5px;background:rgba(224,164,73,.14);border:1px solid rgba(224,164,73,.3);color:#e0a449;border-radius:9px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Add session<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showStats }}\">\n          <div style=\"display:flex;gap:10px;margin-bottom:15px;\">\n            <sc-for list=\"{{ logStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n              <div style=\"flex:1;background:#16161f;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 12px;\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;line-height:1;color:#f3f4f8;\">{{ s.value }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:#6b6e80;margin-top:5px;\">{{ s.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ sessionFormOpen }}\">\n          <div style=\"background:#16161f;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px;margin-bottom:14px;display:flex;flex-direction:column;gap:9px;animation:shelfFade .16s ease;\">\n            <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;\">\n              <div><label style=\"display:block;font-size:10.5px;color:#9a9db0;margin-bottom:4px;\">Date<\u002Flabel><input type=\"date\" value=\"{{ sDraft.date }}\" onchange=\"{{ sDate }}\" style=\"width:100%;background:#101019;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 9px;color:#f3f4f8;font-family:inherit;font-size:12.5px;outline:none;color-scheme:dark;\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:10.5px;color:#9a9db0;margin-bottom:4px;\">Pages<\u002Flabel><input type=\"number\" value=\"{{ sDraft.pages }}\" onchange=\"{{ sPages }}\" placeholder=\"0\" style=\"width:100%;background:#101019;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 9px;color:#f3f4f8;font-family:inherit;font-size:12.5px;outline:none;\"><\u002Fdiv>\n              <div><label style=\"display:block;font-size:10.5px;color:#9a9db0;margin-bottom:4px;\">Minutes<\u002Flabel><input type=\"number\" value=\"{{ sDraft.minutes }}\" onchange=\"{{ sMinutes }}\" placeholder=\"0\" style=\"width:100%;background:#101019;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 9px;color:#f3f4f8;font-family:inherit;font-size:12.5px;outline:none;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <input value=\"{{ sDraft.note }}\" onchange=\"{{ sNote }}\" placeholder=\"Optional note — where you stopped, a thought…\" style=\"width:100%;background:#101019;border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:9px 10px;color:#f3f4f8;font-family:inherit;font-size:13px;outline:none;\">\n            <div style=\"display:flex;gap:8px;justify-content:flex-end;\">\n              <button onclick=\"{{ toggleSessionForm }}\" style=\"padding:8px 14px;background:transparent;border:1px solid rgba(255,255,255,.1);color:#9a9db0;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;\">Cancel<\u002Fbutton>\n              <button onclick=\"{{ addSession }}\" style=\"padding:8px 16px;background:#e0a449;color:#20160a;border:none;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;\">Log it<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ noSessions }}\">\n          <div style=\"text-align:center;padding:24px 0;color:#6b6e80;font-size:13.5px;\">No sessions logged yet. Track a sitting to watch your progress build.<\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;\">\n          <sc-for list=\"{{ sessions }}\" as=\"s\" hint-placeholder-count=\"0\">\n            <div style=\"display:flex;gap:13px;padding:12px 0;border-top:1px solid rgba(255,255,255,.05);\">\n              <div style=\"flex:none;width:46px;text-align:center;\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;line-height:1;color:#f3f4f8;\">{{ s.day }}<\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#6b6e80;margin-top:2px;\">{{ s.mon }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:0;\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:3px;\">\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:600;color:#e0a449;\">{{ s.pages }} pages<\u002Fspan>\n                  <span style=\"width:3px;height:3px;border-radius:50%;background:#3d3f4d;\"><\u002Fspan>\n                  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#9a9db0;\">{{ s.minutes }} min<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{ s.hasNote }}\"><div style=\"font-size:13px;color:#b9bccb;line-height:1.45;\">{{ s.note }}<\u002Fdiv><\u002Fsc-if>\n              <\u002Fdiv>\n              <button onclick=\"{{ s.onDelete }}\" aria-label=\"Delete session\" style=\"flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#4d4f5c;cursor:pointer;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <!-- HIGHLIGHTS -->\n      <section style=\"background:#101019;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:17px 16px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;\">\n          <h2 style=\"margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em;\">Highlights<\u002Fh2>\n          <button onclick=\"{{ toggleHighlightForm }}\" style=\"display:flex;align-items:center;gap:5px;background:rgba(224,164,73,.14);border:1px solid rgba(224,164,73,.3);color:#e0a449;border-radius:9px;padding:7px 12px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg>Add highlight<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ highlightFormOpen }}\">\n          <div style=\"background:#16161f;border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:13px;margin-bottom:14px;display:flex;flex-direction:column;gap:9px;animation:shelfFade .16s ease;\">\n            <textarea value=\"{{ hDraft.text }}\" onchange=\"{{ hText }}\" placeholder=\"Type or paste the passage…\" style=\"width:100%;min-height:64px;resize:vertical;background:#101019;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:10px 11px;color:#f3f4f8;font-family:'Fraunces',serif;font-size:15px;font-style:italic;outline:none;line-height:1.5;\"><\u002Ftextarea>\n            <div style=\"display:flex;gap:9px;align-items:center;\">\n              <input value=\"{{ hDraft.location }}\" onchange=\"{{ hLoc }}\" placeholder=\"Location — e.g. Page 42, Ch. 3\" style=\"flex:1;background:#101019;border:1px solid rgba(255,255,255,.08);border-radius:9px;padding:9px 11px;color:#f3f4f8;font-family:inherit;font-size:13px;outline:none;\">\n              <button onclick=\"{{ toggleHighlightForm }}\" style=\"padding:9px 14px;background:transparent;border:1px solid rgba(255,255,255,.1);color:#9a9db0;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;\">Cancel<\u002Fbutton>\n              <button onclick=\"{{ addHighlight }}\" style=\"padding:9px 16px;background:#e0a449;color:#20160a;border:none;border-radius:9px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;\">Save<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n
